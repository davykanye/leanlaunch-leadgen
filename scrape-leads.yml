name: Scrape Local Launch Leads

on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday 13:00 UTC (~7am Denver, adjust for DST as needed)
  repository_dispatch:
    types: [run-lead-scrape]   # triggered on-demand by the Supabase Edge Function
  workflow_dispatch: {}         # lets you also trigger manually from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scraper_to_supabase.py
